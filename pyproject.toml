[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrape-website"
version = "0.2.0"
description = "Async website scraper that downloads all pages and documents from a domain"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11.11",
    "aiofiles>=24.1.0",
    "aiodns>=3.2.0",
    "lxml>=5.3.0",
    "trafilatura>=2.0.0",
    "curl-cffi>=0.7.0",
    "playwright>=1.60.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
scrape-website = "scrape_website.cli:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
