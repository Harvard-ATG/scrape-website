s18-notbuilt: "Two cards: Next feature, about the weekly sitemap update and schedules, and Known gaps from the refresh, five short lines."
s19-runit: "A dark slide with a terminal-style panel of three commands and a CodeTour line, three short columns below, and links to PR 10 and the two diffs in the footer."
