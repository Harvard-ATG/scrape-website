s9-r7: "Left: eight commit hashes listing how the keep list changed. Right: a dark code panel with the sitemap date check, its variable names shortened."
s10-sitemap: "Four numbered cards across the slide, then a dark panel showing the shape of the per-host sitemap log line, then an Ask the room band."
s11-notpages: "Left: a dark code panel with the three early returns in process_url. Right: three cards naming each gate."
