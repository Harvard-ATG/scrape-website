# What is on screen that the narration does not say, one paragraph per frame (text audio description).
s1-cover: "Dark title slide with a crimson stripe down the left edge. Two commit ranges sit along the bottom: scrape-website 37bce63 to ffe35d6, and apo-mcp-server v1.0.1 to v1.1.0-rc14. Bottom right: 15, 25 or 40 minutes, Nov 2026."
s2-use: "Three cards in a row, then a table of the three lengths. The footer gives the setup check: git rev-parse must print ffe35d6, and the test counts 80, 198 and 34."
s3-map: "Three columns joined by arrows: Launch in apo-mcp-server, Crawl in scrape-website, Ingest in apo-mcp-server. Each column lists file or function names in monospace, with the slide number where each is read."
s4-revisions: "A table of release tags with four columns: tag, change, scraper pin and the prod finding behind it. Rows that changed only apo-mcp-server are shaded."
s5-tiers: "Three tier cards joined by red arrows labelled 403, 429 and fails. Below, a What to read card and a dark Ask the room card."
