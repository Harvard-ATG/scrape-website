      - {at: 14, target: q2}
      - {at: 20, target: q3}
      - {at: 28, target: q4}
      - {at: 36, target: q5}
      - {at: 55, target: none}
  - frame: s18-notbuilt
    track: "25 min"
    narration: "What is not built. The next feature is the weekly update driven by sitemap dates. Its planner and the twenty rules behind it exist as reference code in aidocs, with a hundred ninety-eight tests, but nothing calls it from the scraper yet. When it is wired in, a weekly run fetches about three hundred forty changed pages instead of fifty-seven thousand. The two existing code tours cover that design. Schedules are sketched but not applied. From the refresh itself, a short list of known gaps: the math department site sits behind a Cloudflare challenge that no tier passes, about a hundred forty scanned PDFs have no text, one career services URL is too long for the vector store, three files need a hard delete, and the retirement loop is still serial."
    targets:
      next: "Next feature"
      gaps: "Known gaps from the refresh"
    cues:
      - {at: 4, target: next}
      - {at: 30, target: gaps}
      - {at: 50, target: none}
  - frame: s19-runit
    track: "Core"
    narration: "To read it yourself: check out ffe35d6, run the tests, and read the forty-seven commits in order. Each one is small, and each message says what prod showed. Then run the two code tours: scraper refinements first, then refresh orchestration in apo-mcp-server. If you only have ten minutes, start with the rate-limit fix, thirty-two lines and a seventy-four-line test, then the not-a-page gates. Leave comments on pull request 10, with the question number from the last slide, so we can close them one by one. Thank you."
    targets:
      commands: "git fetch origin && git checkout ffe35d6"
      start: "Start with"
      then: "Then"
