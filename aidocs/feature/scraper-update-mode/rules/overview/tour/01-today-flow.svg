<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" width="640" height="556" role="img" aria-label="How a scrape works today: entry, crawl, fetch, save, manifest and S3, ingest, with three problems marked A, B and C."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>
.t{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .s{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#4F5D6A} .f{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B}
.m{font:400 11px ui-monospace, Menlo, Consolas, monospace;fill:#15212B} .ta{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#0A6B8D} .tw{font:600 12.5px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#955700}
.h{font:700 16px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .l{font:500 10.5px ui-monospace, Menlo, Consolas, monospace;fill:#4F5D6A} .n{font:700 12px ui-monospace, Menlo, Consolas, monospace;fill:#fff}
.b{fill:#FFFFFF;stroke:#C6D0D8;stroke-width:1.5} .ba{fill:#DCEFF6;stroke:#0A6B8D;stroke-width:1.6}
.bw{fill:#FBEBD1;stroke:#955700;stroke-width:1.6} .bg{fill:#E7EDF1;stroke:#C6D0D8;stroke-width:1.5}
.d{stroke-dasharray:6 4} .ln{stroke:#4A5864;stroke-width:1.7;fill:none} .lna{stroke:#0A6B8D;stroke-width:1.9;fill:none}
.lnw{stroke:#955700;stroke-width:1.5;fill:none;stroke-dasharray:3 3} .grid{stroke:#C6D0D8;stroke-width:1;stroke-dasharray:2 4}
.mk{fill:#4A5864} .mka{fill:#0A6B8D} .dot{fill:#0A6B8D} .dotw{fill:#955700}
</style><rect x="0.75" y="0.75" width="638.5" height="554.5" rx="10" fill="#fff" stroke="#C6D0D8"/><text class="h" x="20" y="28">How a scrape works today</text><rect class="b" x="20" y="48" width="300" height="56" rx="8"/><text class="t" x="32" y="70">sites.toml entry</text><text class="s" x="32" y="88">seed URL and scope rules</text><rect class="b" x="20" y="126" width="300" height="56" rx="8"/><text class="t" x="32" y="148">Crawl</text><text class="s" x="32" y="166">follow links on one host, random order</text><rect class="b" x="20" y="204" width="300" height="56" rx="8"/><text class="t" x="32" y="226">Fetch</text><text class="s" x="32" y="244">3 tiers: plain, browser-like, Playwright</text><rect class="b" x="20" y="282" width="300" height="56" rx="8"/><text class="t" x="32" y="304">Save</text><text class="s" x="32" y="322">pages, text, files, state.db rows</text><rect class="b" x="20" y="360" width="300" height="56" rx="8"/><text class="t" x="32" y="382">Manifest and S3</text><text class="s" x="32" y="400">written only if the crawl is complete</text><rect class="b" x="20" y="438" width="300" height="56" rx="8"/><text class="t" x="32" y="460">Ingest</text><text class="s" x="32" y="478">unchanged: skip   ·   missing: retire</text><line class="ln" x1="170" y1="104" x2="170" y2="125" marker-end="url(#ar)"/><line class="ln" x1="170" y1="182" x2="170" y2="203" marker-end="url(#ar)"/><line class="ln" x1="170" y1="260" x2="170" y2="281" marker-end="url(#ar)"/><line class="ln" x1="170" y1="338" x2="170" y2="359" marker-end="url(#ar)"/><line class="ln" x1="170" y1="416" x2="170" y2="437" marker-end="url(#ar)"/><line class="lnw" x1="320" y1="154" x2="346" y2="154"/><rect class="bw" x="346" y="126" width="274" height="56" rx="8"/><circle class="dotw" cx="366" cy="154" r="11"/><text class="n" x="366" y="158" text-anchor="middle">A</text><text class="tw" x="386" y="150">Crawl order is random:</text><text class="tw" x="386" y="168">45 to 136 pages on one site</text><line class="lnw" x1="320" y1="310" x2="346" y2="310"/><rect class="bw" x="346" y="282" width="274" height="56" rx="8"/><circle class="dotw" cx="366" cy="310" r="11"/><text class="n" x="366" y="314" text-anchor="middle">B</text><text class="tw" x="386" y="306">A normal run never refreshes</text><text class="tw" x="386" y="324">a changed page</text><line class="lnw" x1="320" y1="466" x2="346" y2="466"/><rect class="bw" x="346" y="438" width="274" height="56" rx="8"/><circle class="dotw" cx="366" cy="466" r="11"/><text class="n" x="366" y="470" text-anchor="middle">C</text><text class="tw" x="386" y="462">Missing from the crawl</text><text class="tw" x="386" y="480">means retired, unchecked</text><text class="s" x="20" y="540">Normal run: adds new pages only.   Fresh run (--fresh): re-crawls everything.</text></svg>