<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 584" width="640" height="584" role="img" aria-label="A sitemap URL passes five gates (normalize, host, seed path, include, exclude) and ends as new, changed, no date, unchanged or never captured."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>
.t{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .s{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#4F5D6A} .f{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B}
.m{font:400 11px ui-monospace, Menlo, Consolas, monospace;fill:#15212B} .ta{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#0A6B8D} .tw{font:600 12.5px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#955700}
.h{font:700 16px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .l{font:500 10.5px ui-monospace, Menlo, Consolas, monospace;fill:#4F5D6A} .n{font:700 12px ui-monospace, Menlo, Consolas, monospace;fill:#fff}
.b{fill:#FFFFFF;stroke:#C6D0D8;stroke-width:1.5} .ba{fill:#DCEFF6;stroke:#0A6B8D;stroke-width:1.6}
.bw{fill:#FBEBD1;stroke:#955700;stroke-width:1.6} .bg{fill:#E7EDF1;stroke:#C6D0D8;stroke-width:1.5}
.d{stroke-dasharray:6 4} .ln{stroke:#4A5864;stroke-width:1.7;fill:none} .lna{stroke:#0A6B8D;stroke-width:1.9;fill:none}
.lnw{stroke:#955700;stroke-width:1.5;fill:none;stroke-dasharray:3 3} .grid{stroke:#C6D0D8;stroke-width:1;stroke-dasharray:2 4}
.mk{fill:#4A5864} .mka{fill:#0A6B8D} .dot{fill:#0A6B8D} .dotw{fill:#955700}
</style><rect x="0.75" y="0.75" width="638.5" height="582.5" rx="10" fill="#fff" stroke="#C6D0D8"/><text class="h" x="20" y="28">What happens to one URL</text><rect class="bg" x="20" y="42" width="300" height="28" rx="14"/><text class="t" x="170" y="61" text-anchor="middle">A URL from the sitemap</text><line class="ln" x1="170" y1="70" x2="170" y2="87" marker-end="url(#ar)"/><rect class="b" x="20" y="88" width="300" height="46" rx="8"/><text class="t" x="32" y="110">Normalize (R1)</text><text class="s" x="32" y="128">https, no trailing slash</text><rect class="b" x="20" y="152" width="300" height="46" rx="8"/><text class="t" x="32" y="174">Same host? (R2)</text><text class="s" x="32" y="192">exact host name</text><line class="lnw" x1="320" y1="175" x2="346" y2="175"/><rect class="bw" x="346" y="157" width="274" height="36" rx="8"/><text class="tw" x="358" y="180">no: another host</text><rect class="b" x="20" y="216" width="300" height="46" rx="8"/><text class="t" x="32" y="238">Inside the seed path? (R3)</text><text class="s" x="32" y="256">path-scoped entries only</text><line class="lnw" x1="320" y1="239" x2="346" y2="239"/><rect class="bw" x="346" y="221" width="274" height="36" rx="8"/><text class="tw" x="358" y="244">no: outside the path</text><rect class="b" x="20" y="280" width="300" height="46" rx="8"/><text class="t" x="32" y="302">Include pattern? (R4)</text><text class="s" x="32" y="320">entries with patterns only</text><line class="lnw" x1="320" y1="303" x2="346" y2="303"/><rect class="bw" x="346" y="285" width="274" height="36" rx="8"/><text class="tw" x="358" y="308">no: nothing matched</text><rect class="b" x="20" y="344" width="300" height="46" rx="8"/><text class="t" x="32" y="366">Hits an exclude? (R5 R6 R7)</text><text class="s" x="32" y="384">tags, /page/N, feeds, search, events</text><line class="lnw" x1="320" y1="367" x2="346" y2="367"/><rect class="bw" x="346" y="349" width="274" height="36" rx="8"/><text class="tw" x="358" y="372">yes: excluded</text><line class="ln" x1="170" y1="134" x2="170" y2="151" marker-end="url(#ar)"/><line class="ln" x1="170" y1="198" x2="170" y2="215" marker-end="url(#ar)"/><line class="ln" x1="170" y1="262" x2="170" y2="279" marker-end="url(#ar)"/><line class="ln" x1="170" y1="326" x2="170" y2="343" marker-end="url(#ar)"/><line class="lna" x1="170" y1="390" x2="170" y2="412" marker-end="url(#ara)"/><text class="l" x="186" y="407">compare with what is stored (R13)</text><rect class="ba" x="20" y="420" width="194" height="68" rx="8"/><text class="ta" x="32" y="442">New</text><text class="s" x="32" y="460">not stored, date after baseline</text><text class="t" x="32" y="482">→ fetch</text><rect class="ba" x="226" y="420" width="194" height="68" rx="8"/><text class="ta" x="238" y="442">Changed</text><text class="s" x="238" y="460">stored date differs</text><text class="t" x="238" y="482">→ fetch</text><rect class="ba" x="432" y="420" width="194" height="68" rx="8"/><text class="ta" x="444" y="442">No date</text><text class="s" x="444" y="460">sitemap gives none</text><text class="t" x="444" y="482">→ fetch each run</text><rect class="bg" x="20" y="500" width="194" height="68" rx="8"/><text class="t" x="32" y="522">Unchanged</text><text class="s" x="32" y="540">same date as stored</text><text class="t" x="32" y="562">→ keep</text><rect class="bw" x="226" y="500" width="194" height="68" rx="8"/><text class="tw" x="238" y="522">Never captured</text><text class="s" x="238" y="540">not stored, old date</text><text class="tw" x="238" y="562">→ backfill list (R20)</text></svg>