<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 664" width="640" height="664" role="img" aria-label="Proposed update run: entry, scope rules, read the sitemap, plan, fetch only the plan, save, record state, ingest."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>
.t{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .s{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#4F5D6A} .f{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B}
.m{font:400 11px ui-monospace, Menlo, Consolas, monospace;fill:#15212B} .ta{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#0A6B8D} .tw{font:600 12.5px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#955700}
.h{font:700 16px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .l{font:500 10.5px ui-monospace, Menlo, Consolas, monospace;fill:#4F5D6A} .n{font:700 12px ui-monospace, Menlo, Consolas, monospace;fill:#fff}
.b{fill:#FFFFFF;stroke:#C6D0D8;stroke-width:1.5} .ba{fill:#DCEFF6;stroke:#0A6B8D;stroke-width:1.6}
.bw{fill:#FBEBD1;stroke:#955700;stroke-width:1.6} .bg{fill:#E7EDF1;stroke:#C6D0D8;stroke-width:1.5}
.d{stroke-dasharray:6 4} .ln{stroke:#4A5864;stroke-width:1.7;fill:none} .lna{stroke:#0A6B8D;stroke-width:1.9;fill:none}
.lnw{stroke:#955700;stroke-width:1.5;fill:none;stroke-dasharray:3 3} .grid{stroke:#C6D0D8;stroke-width:1;stroke-dasharray:2 4}
.mk{fill:#4A5864} .mka{fill:#0A6B8D} .dot{fill:#0A6B8D} .dotw{fill:#955700}
</style><rect x="0.75" y="0.75" width="638.5" height="662.5" rx="10" fill="#fff" stroke="#C6D0D8"/><text class="h" x="20" y="28">Proposed: an update run</text><rect class="b" x="20" y="46" width="300" height="54" rx="8"/><text class="t" x="32" y="68">sites.toml entry</text><text class="s" x="32" y="86">same as today</text><rect class="b" x="20" y="120" width="300" height="54" rx="8"/><text class="t" x="32" y="142">Scope rules</text><text class="s" x="32" y="160">host, seed path, include, exclude</text><rect class="ba d" x="20" y="194" width="300" height="54" rx="8"/><text class="ta" x="32" y="216">Read the sitemap</text><text class="s" x="32" y="234">every URL with its last-modified date</text><rect class="ba d" x="20" y="268" width="300" height="54" rx="8"/><text class="ta" x="32" y="290">Plan</text><text class="s" x="32" y="308">compare each date with what is stored</text><rect class="b" x="20" y="342" width="300" height="54" rx="8"/><text class="t" x="32" y="364">Fetch only the plan</text><text class="s" x="32" y="382">same tiered fetcher as today</text><rect class="b" x="20" y="416" width="300" height="54" rx="8"/><text class="t" x="32" y="438">Save</text><text class="s" x="32" y="456">changed pages replaced, unchanged kept</text><rect class="ba d" x="20" y="490" width="300" height="54" rx="8"/><text class="ta" x="32" y="512">Record state</text><text class="s" x="32" y="530">date and fetch time per URL</text><rect class="b" x="20" y="564" width="300" height="54" rx="8"/><text class="t" x="32" y="586">Ingest</text><text class="s" x="32" y="604">unchanged: hash skip</text><line class="ln" x1="170" y1="100" x2="170" y2="119" marker-end="url(#ar)"/><line class="lna" x1="170" y1="174" x2="170" y2="193" marker-end="url(#ara)"/><line class="lna" x1="170" y1="248" x2="170" y2="267" marker-end="url(#ara)"/><line class="ln" x1="170" y1="322" x2="170" y2="341" marker-end="url(#ar)"/><line class="ln" x1="170" y1="396" x2="170" y2="415" marker-end="url(#ar)"/><line class="ln" x1="170" y1="470" x2="170" y2="489" marker-end="url(#ar)"/><line class="ln" x1="170" y1="544" x2="170" y2="563" marker-end="url(#ar)"/><line class="lnw" x1="320" y1="147" x2="346" y2="147"/><rect class="bw" x="346" y="120" width="274" height="54" rx="8"/><text class="tw" x="358" y="144">tiny path-scoped section:</text><text class="tw" x="358" y="162">refetch the seeds only (R10)</text><line class="lnw" x1="320" y1="221" x2="346" y2="221"/><rect class="bw" x="346" y="194" width="274" height="54" rx="8"/><text class="tw" x="358" y="218">unreadable, or lists another host:</text><text class="tw" x="358" y="236">skip the host (R11, R12)</text><text class="l" x="346" y="256">THE PLAN SORTS EVERY URL</text><rect class="bg d" x="346" y="262" width="274" height="26" rx="6"/><text class="s" x="358" y="279">unchanged → skip</text><rect class="bw d" x="346" y="292" width="274" height="26" rx="6"/><text class="tw" x="358" y="309">never captured → backfill</text><rect class="ba d" x="346" y="322" width="274" height="26" rx="6"/><text class="f" x="358" y="339">new → fetch</text><rect class="ba d" x="346" y="352" width="274" height="26" rx="6"/><text class="f" x="358" y="369">changed → fetch</text><rect class="ba d" x="346" y="382" width="274" height="26" rx="6"/><text class="f" x="358" y="399">no date → fetch every run</text><line class="lna" x1="346" y1="295" x2="321" y2="295" marker-end="url(#ara)"/><rect class="b" x="20" y="636" width="16" height="12" rx="3"/><text class="s" x="44" y="646">already in the scraper</text><rect class="ba d" x="210" y="636" width="16" height="12" rx="3"/><text class="s" x="234" y="646">new in this design: reference code and tests, not wired in</text></svg>