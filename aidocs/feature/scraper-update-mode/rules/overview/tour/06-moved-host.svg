<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" width="640" height="394" role="img" aria-label="When a host moves, its old sitemap lists only the new host's pages; without a check that looks like 1,377 deleted pages; rule R12 blocks the host instead."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>
.t{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .s{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#4F5D6A} .f{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B}
.m{font:400 11px ui-monospace, Menlo, Consolas, monospace;fill:#15212B} .ta{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#0A6B8D} .tw{font:600 12.5px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#955700}
.h{font:700 16px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .l{font:500 10.5px ui-monospace, Menlo, Consolas, monospace;fill:#4F5D6A} .n{font:700 12px ui-monospace, Menlo, Consolas, monospace;fill:#fff}
.b{fill:#FFFFFF;stroke:#C6D0D8;stroke-width:1.5} .ba{fill:#DCEFF6;stroke:#0A6B8D;stroke-width:1.6}
.bw{fill:#FBEBD1;stroke:#955700;stroke-width:1.6} .bg{fill:#E7EDF1;stroke:#C6D0D8;stroke-width:1.5}
.d{stroke-dasharray:6 4} .ln{stroke:#4A5864;stroke-width:1.7;fill:none} .lna{stroke:#0A6B8D;stroke-width:1.9;fill:none}
.lnw{stroke:#955700;stroke-width:1.5;fill:none;stroke-dasharray:3 3} .grid{stroke:#C6D0D8;stroke-width:1;stroke-dasharray:2 4}
.mk{fill:#4A5864} .mka{fill:#0A6B8D} .dot{fill:#0A6B8D} .dotw{fill:#955700}
</style><rect x="0.75" y="0.75" width="638.5" height="392.5" rx="10" fill="#fff" stroke="#C6D0D8"/><text class="h" x="20" y="28">A site moved: gone, or moved?</text><rect class="bw" x="20" y="44" width="290" height="176" rx="8"/><text class="tw" x="32" y="66">Without a check</text><text class="f" x="32" y="86">July: oie.fas sitemap lists</text><text class="f" x="32" y="103">oie.fas pages.</text><text class="f" x="32" y="120">October: it lists only</text><text class="f" x="32" y="137">studyabroad.college pages.</text><text class="f" x="32" y="154"></text><text class="tw" x="32" y="171">Looks like every page vanished:</text><text class="tw" x="32" y="188">1,377 "departures" on 4 hosts.</text><rect class="ba" x="330" y="44" width="290" height="176" rx="8"/><text class="ta" x="342" y="66">With rule R12</text><text class="f" x="342" y="86">host_moved(): the whole URL set</text><text class="f" x="342" y="103">changed host.</text><text class="f" x="342" y="120">plan.blocked =</text><text class="f" x="342" y="137">"sitemap_foreign_host"</text><text class="f" x="342" y="154"></text><text class="t" x="342" y="171">No fetches and no removals</text><text class="t" x="342" y="188">for the old host.</text><text class="t" x="20" y="246">The four moves (sites.toml now lists the new hosts):</text><text class="m" x="24" y="270">oie.fas.harvard.edu</text><text class="t" x="300" y="270" text-anchor="middle">→</text><text class="m" x="320" y="270">studyabroad.college.harvard.edu</text><text class="m" x="24" y="292">summerfunding.college.harvard.edu</text><text class="t" x="300" y="292" text-anchor="middle">→</text><text class="m" x="320" y="292">sfsao.college.harvard.edu</text><text class="m" x="24" y="314">incomingstudents.college.harvard.edu</text><text class="t" x="300" y="314" text-anchor="middle">→</text><text class="m" x="320" y="314">firstyear.college.harvard.edu</text><text class="m" x="24" y="336">oaisc.fas.harvard.edu</text><text class="t" x="300" y="336" text-anchor="middle">→</text><text class="m" x="320" y="336">secretary.college.harvard.edu</text><text class="s" x="20" y="376">Still open: the files already ingested under the old host names.</text></svg>