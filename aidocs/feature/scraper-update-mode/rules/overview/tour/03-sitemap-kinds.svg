<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Three kinds of sitemap file: the XML sitemap has last-modified dates; the markdown sitemap and per-page .md copies do not."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>
.t{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .s{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#4F5D6A} .f{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B}
.m{font:400 11px ui-monospace, Menlo, Consolas, monospace;fill:#15212B} .ta{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#0A6B8D} .tw{font:600 12.5px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#955700}
.h{font:700 16px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .l{font:500 10.5px ui-monospace, Menlo, Consolas, monospace;fill:#4F5D6A} .n{font:700 12px ui-monospace, Menlo, Consolas, monospace;fill:#fff}
.b{fill:#FFFFFF;stroke:#C6D0D8;stroke-width:1.5} .ba{fill:#DCEFF6;stroke:#0A6B8D;stroke-width:1.6}
.bw{fill:#FBEBD1;stroke:#955700;stroke-width:1.6} .bg{fill:#E7EDF1;stroke:#C6D0D8;stroke-width:1.5}
.d{stroke-dasharray:6 4} .ln{stroke:#4A5864;stroke-width:1.7;fill:none} .lna{stroke:#0A6B8D;stroke-width:1.9;fill:none}
.lnw{stroke:#955700;stroke-width:1.5;fill:none;stroke-dasharray:3 3} .grid{stroke:#C6D0D8;stroke-width:1;stroke-dasharray:2 4}
.mk{fill:#4A5864} .mka{fill:#0A6B8D} .dot{fill:#0A6B8D} .dotw{fill:#955700}
</style><rect x="0.75" y="0.75" width="638.5" height="338.5" rx="10" fill="#fff" stroke="#C6D0D8"/><text class="h" x="20" y="28">Three kinds of sitemap file</text><rect class="ba" x="20" y="48" width="600" height="74" rx="8"/><text class="ta" x="32" y="70">XML sitemap</text><text class="s" x="32" y="88">/sitemap.xml  ·  79 of 83 hosts</text><text class="m" x="32" y="114">&lt;lastmod&gt;2025-06-06T21:49:27+00:00&lt;/lastmod&gt;</text><rect x="526" y="60" width="82" height="24" rx="12" style="fill:#0A6B8D;stroke:#0A6B8D;stroke-width:1.5"/><text class="n" x="567.0" y="76" text-anchor="middle">has dates</text><rect class="bg" x="20" y="136" width="600" height="74" rx="8"/><text class="t" x="32" y="158">Markdown sitemap</text><text class="s" x="32" y="176">/sitemap-llm  ·  52 hosts (Drupal 10)</text><text class="m" x="32" y="202">- [Contact](https://haa.fas…/contact.md)</text><rect x="526" y="148" width="82" height="24" rx="12" style="fill:#fff;stroke:#C6D0D8;stroke-width:1.5"/><text class="s" x="567.0" y="164" text-anchor="middle">no dates</text><rect class="bg" x="20" y="224" width="600" height="74" rx="8"/><text class="t" x="32" y="246">Per-page .md copy</text><text class="s" x="32" y="264">page URL + .md  ·  the same 52 hosts</text><text class="m" x="32" y="290">response dates are the render time</text><rect x="526" y="236" width="82" height="24" rx="12" style="fill:#fff;stroke:#C6D0D8;stroke-width:1.5"/><text class="s" x="567.0" y="252" text-anchor="middle">no dates</text><text class="t" x="20" y="322">Only the XML sitemap can say what changed.</text></svg>