<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" width="640" height="544" role="img" aria-label="Deleting a page: today a full crawl's missing pages are retired by ingest; proposed, sitemap departures pass guards and a confirmation fetch first."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>
.t{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .s{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#4F5D6A} .f{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B}
.m{font:400 11px ui-monospace, Menlo, Consolas, monospace;fill:#15212B} .ta{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#0A6B8D} .tw{font:600 12.5px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#955700}
.h{font:700 16px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .l{font:500 10.5px ui-monospace, Menlo, Consolas, monospace;fill:#4F5D6A} .n{font:700 12px ui-monospace, Menlo, Consolas, monospace;fill:#fff}
.b{fill:#FFFFFF;stroke:#C6D0D8;stroke-width:1.5} .ba{fill:#DCEFF6;stroke:#0A6B8D;stroke-width:1.6}
.bw{fill:#FBEBD1;stroke:#955700;stroke-width:1.6} .bg{fill:#E7EDF1;stroke:#C6D0D8;stroke-width:1.5}
.d{stroke-dasharray:6 4} .ln{stroke:#4A5864;stroke-width:1.7;fill:none} .lna{stroke:#0A6B8D;stroke-width:1.9;fill:none}
.lnw{stroke:#955700;stroke-width:1.5;fill:none;stroke-dasharray:3 3} .grid{stroke:#C6D0D8;stroke-width:1;stroke-dasharray:2 4}
.mk{fill:#4A5864} .mka{fill:#0A6B8D} .dot{fill:#0A6B8D} .dotw{fill:#955700}
</style><rect x="0.75" y="0.75" width="638.5" height="542.5" rx="10" fill="#fff" stroke="#C6D0D8"/><text class="h" x="20" y="28">Deleting a page</text><text class="t" x="20" y="52">Today: the crawl decides</text><text class="ta" x="330" y="52">Proposed: the sitemap decides</text><rect class="b" x="20" y="62" width="290" height="72" rx="8"/><text class="t" x="32" y="84">Full (fresh) crawl</text><text class="s" x="32" y="102">finds some pages,</text><text class="s" x="32" y="118">misses others</text><line class="ln" x1="165" y1="134" x2="165" y2="159" marker-end="url(#ar)"/><rect class="b" x="20" y="160" width="290" height="72" rx="8"/><text class="t" x="32" y="182">Files on disk = active set</text><text class="s" x="32" y="200">ingest reads the host's folders</text><line class="ln" x1="165" y1="232" x2="165" y2="257" marker-end="url(#ar)"/><rect class="b" x="20" y="258" width="290" height="72" rx="8"/><text class="t" x="32" y="280">Ingest compares</text><text class="s" x="32" y="298">records not in the set</text><text class="s" x="32" y="314">are retired</text><line class="ln" x1="165" y1="330" x2="165" y2="355" marker-end="url(#ar)"/><rect class="b" x="20" y="356" width="290" height="72" rx="8"/><text class="t" x="32" y="378">Retired</text><text class="s" x="32" y="396">soft: hidden from search</text><text class="s" x="32" y="412">(hard delete only if flagged)</text><rect class="ba d" x="330" y="62" width="290" height="66" rx="8"/><text class="ta" x="342" y="84">Compare sitemap snapshots</text><text class="s" x="342" y="102">today vs last saved, in scope</text><line class="lna" x1="475" y1="128" x2="475" y2="139" marker-end="url(#ara)"/><rect class="ba d" x="330" y="140" width="290" height="66" rx="8"/><text class="ta" x="342" y="162">Departures (R15)</text><text class="s" x="342" y="180">listed before, gone now</text><line class="lna" x1="475" y1="206" x2="475" y2="217" marker-end="url(#ara)"/><rect class="bw d" x="330" y="218" width="290" height="66" rx="8"/><text class="tw" x="342" y="240">Guards (R11 R12 R15)</text><text class="s" x="342" y="258">unreadable · moved · over 30% gone</text><line class="lna" x1="475" y1="284" x2="475" y2="295" marker-end="url(#ara)"/><rect class="ba d" x="330" y="296" width="290" height="66" rx="8"/><text class="ta" x="342" y="318">Confirm by fetching (R16)</text><text class="s" x="342" y="336">404/410 retire · 403 hold</text><text class="s" x="342" y="352">redirect follow · 200 keep · 5xx never</text><line class="lna" x1="475" y1="362" x2="475" y2="373" marker-end="url(#ara)"/><rect class="ba d" x="330" y="374" width="290" height="66" rx="8"/><text class="ta" x="342" y="396">Retire after a clean run (R17)</text><text class="s" x="342" y="414">complete and uncapped only</text><rect class="bw" x="20" y="468" width="290" height="58" rx="8"/><text class="tw" x="32" y="490">A page the crawl missed is retired</text><text class="tw" x="32" y="508">though it still exists.</text><rect class="bg d" x="330" y="468" width="290" height="58" rx="8"/><text class="s" x="342" y="490">Pages never in a sitemap rely on</text><text class="s" x="342" y="508">a monthly full refresh (R19).</text></svg>