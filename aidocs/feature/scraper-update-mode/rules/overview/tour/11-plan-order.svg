<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 502" width="640" height="502" role="img" aria-label="The order of checks inside plan_update: tiny path-scoped section, unreadable sitemap, another host, per-URL scope and date comparison, never-captured list, seeds, departures."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>
.t{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .s{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#4F5D6A} .f{font:400 12px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B}
.m{font:400 11px ui-monospace, Menlo, Consolas, monospace;fill:#15212B} .ta{font:600 14px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#0A6B8D} .tw{font:600 12.5px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#955700}
.h{font:700 16px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;fill:#15212B} .l{font:500 10.5px ui-monospace, Menlo, Consolas, monospace;fill:#4F5D6A} .n{font:700 12px ui-monospace, Menlo, Consolas, monospace;fill:#fff}
.b{fill:#FFFFFF;stroke:#C6D0D8;stroke-width:1.5} .ba{fill:#DCEFF6;stroke:#0A6B8D;stroke-width:1.6}
.bw{fill:#FBEBD1;stroke:#955700;stroke-width:1.6} .bg{fill:#E7EDF1;stroke:#C6D0D8;stroke-width:1.5}
.d{stroke-dasharray:6 4} .ln{stroke:#4A5864;stroke-width:1.7;fill:none} .lna{stroke:#0A6B8D;stroke-width:1.9;fill:none}
.lnw{stroke:#955700;stroke-width:1.5;fill:none;stroke-dasharray:3 3} .grid{stroke:#C6D0D8;stroke-width:1;stroke-dasharray:2 4}
.mk{fill:#4A5864} .mka{fill:#0A6B8D} .dot{fill:#0A6B8D} .dotw{fill:#955700}
</style><rect x="0.75" y="0.75" width="638.5" height="500.5" rx="10" fill="#fff" stroke="#C6D0D8"/><text class="h" x="20" y="28">plan_update: the order of checks</text><circle class="dot" cx="38" cy="68" r="13"/><text class="n" x="38" y="73" text-anchor="middle">1</text><line class="ln" x1="38" y1="81" x2="38" y2="101"/><rect class="b" x="64" y="46" width="556" height="44" rx="8"/><text class="t" x="76" y="68">Tiny path-scoped section?</text><text class="s" x="76" y="84">refetch the seeds only (R10)</text><circle class="dot" cx="38" cy="124" r="13"/><text class="n" x="38" y="129" text-anchor="middle">2</text><line class="ln" x1="38" y1="137" x2="38" y2="157"/><rect class="bw" x="64" y="102" width="556" height="44" rx="8"/><text class="tw" x="76" y="124">Sitemap unreadable or empty?</text><text class="s" x="76" y="140">block the host (R11)</text><circle class="dot" cx="38" cy="180" r="13"/><text class="n" x="38" y="185" text-anchor="middle">3</text><line class="ln" x1="38" y1="193" x2="38" y2="213"/><rect class="bw" x="64" y="158" width="556" height="44" rx="8"/><text class="tw" x="76" y="180">Sitemap lists only another host?</text><text class="s" x="76" y="196">block the host (R12)</text><circle class="dot" cx="38" cy="236" r="13"/><text class="n" x="38" y="241" text-anchor="middle">4</text><line class="ln" x1="38" y1="249" x2="38" y2="269"/><rect class="b" x="64" y="214" width="556" height="44" rx="8"/><text class="t" x="76" y="236">For each URL: in scope?</text><text class="s" x="76" y="252">evaluate(): R2 to R9</text><circle class="dot" cx="38" cy="292" r="13"/><text class="n" x="38" y="297" text-anchor="middle">5</text><line class="ln" x1="38" y1="305" x2="38" y2="325"/><rect class="b" x="64" y="270" width="556" height="44" rx="8"/><text class="t" x="76" y="292">Compare the date with what is stored</text><text class="s" x="76" y="308">new · changed · no date · unchanged (R13, R13b)</text><circle class="dot" cx="38" cy="348" r="13"/><text class="n" x="38" y="353" text-anchor="middle">6</text><line class="ln" x1="38" y1="361" x2="38" y2="381"/><rect class="b" x="64" y="326" width="556" height="44" rx="8"/><text class="t" x="76" y="348">Not stored and not changed since the baseline?</text><text class="s" x="76" y="364">backfill list, not fetched (R20)</text><circle class="dot" cx="38" cy="404" r="13"/><text class="n" x="38" y="409" text-anchor="middle">7</text><line class="ln" x1="38" y1="417" x2="38" y2="437"/><rect class="b" x="64" y="382" width="556" height="44" rx="8"/><text class="t" x="76" y="404">Seeds</text><text class="s" x="76" y="420">always fetched (R9)</text><circle class="dot" cx="38" cy="460" r="13"/><text class="n" x="38" y="465" text-anchor="middle">8</text><rect class="b" x="64" y="438" width="556" height="44" rx="8"/><text class="t" x="76" y="460">Departures vs the last snapshot</text><text class="s" x="76" y="476">held if over 30% (R15)</text></svg>